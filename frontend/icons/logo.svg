<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bingo">
  <defs>
    <radialGradient id="gBlue" cx="32%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#4d7cff"/>
      <stop offset="55%" stop-color="#003399"/>
      <stop offset="100%" stop-color="#001a66"/>
    </radialGradient>
    <radialGradient id="gGold" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffe566"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#d4a000"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#001a4d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Placa clara: contraste sobre el navbar azul -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#ffffff"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#ffcc00" stroke-width="2.5"/>

  <!-- Balota B (atrás, izquierda) -->
  <g filter="url(#soft)">
    <circle cx="24.5" cy="34" r="17.5" fill="url(#gBlue)"/>
    <ellipse cx="18.8" cy="26" rx="6" ry="3.5" fill="#fff" opacity="0.4"/>
    <rect x="11.2" y="28.8" width="26.6" height="10.4" rx="1" fill="#f5f5f5"/>
    <circle cx="24.5" cy="34" r="6.2" fill="#fff" stroke="#001a66" stroke-width="1.3"/>
    <text x="24.5" y="37.2" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="9" font-weight="800" fill="#111">B</text>
  </g>

  <!-- Balota G (adelante, derecha) -->
  <g filter="url(#soft)">
    <circle cx="41.5" cy="29" r="16.2" fill="url(#gGold)"/>
    <ellipse cx="36.2" cy="22" rx="5.4" ry="3.1" fill="#fff" opacity="0.48"/>
    <rect x="29.2" y="24.2" width="24.6" height="9.6" rx="1" fill="#f7f7f7"/>
    <circle cx="41.5" cy="29" r="5.7" fill="#fff" stroke="#003399" stroke-width="1.25"/>
    <text x="41.5" y="31.9" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="8.4" font-weight="800" fill="#003399">G</text>
  </g>
</svg>
